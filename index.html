<body>
<header><div><h1><img class="appLogo" src="./icon-192.png" alt=""><span id="headerTitle">館内ナビ</span> <span style="font-size:10px;background:#222;color:#fff;border-radius:999px;padding:4px 7px">全国施設版</span></h1><div id="headerSub" class="sub">47都道府県の大型商業施設・19駅・20言語対応</div></div><button class="menuButton" type="button" onclick="openInfoPage('menu')" aria-label="メニューを開く">☰</button></header>
<main>
<section class="card">
<select id="langSelect" class="facility" onchange="setLanguage(this.value)" style="margin-bottom:8px"></select>
<label for="prefectureSelect" style="display:block;font-size:12px;font-weight:800;margin:3px 0 6px">① 都道府県を選ぶ</label>
<select id="prefectureSelect" class="facility" onchange="changePrefecture(this.value)" style="margin-bottom:10px"></select>
<label for="facilitySelect" style="display:block;font-size:12px;font-weight:800;margin:3px 0 6px">② 施設を選ぶ</label>
<select id="facilitySelect" class="facility" onchange="changeFacility(this.value)"></select>
<div style="margin-top:10px"><input id="facilityQ" class="facility" placeholder="施設名・県名で探す" oninput="renderFacilityCatalog()" aria-label="施設名・県名で探す"></div>
<div id="facilityCatalog" class="catalog"></div>
<div id="facilityInfo" style="margin-top:11px"></div>
<div class="row" style="margin-top:10px"><a id="officialMap" href="#" target="_blank">🗺 <span id="officialMapText">公式マップ/案内</span></a><button id="locationFixBtn" onclick="focusCurrentLocation()">📍 現在地を選ぶ</button></div>
<div id="precisionNote" class="precision hidden"></div>
</section>

<section class="card" id="floorCard">
<b id="floorHeading">館内の場所</b>
<div id="floorButtons" class="floorBtns"></div>
<div id="floorMap" class="mapBox hidden" aria-label="階ごとの概略図"></div>
<div id="floorPlaces" class="placeList"></div>
<div id="mapLegend" class="mapLegend"></div>
</section>

<section class="card">
<div class="search"><input id="q" placeholder="行き先・県名・施設名を入力"><button id="searchBtn" onclick="searchPlace()">検索</button></div>
<div id="quick" class="chips" style="margin-top:9px"></div><div id="results"></div>
</section>

<section id="navCard" class="card hidden">
<div class="bigstep"><div id="stepNo" style="font-size:12px;opacity:.85"></div><div id="arrow" class="arrow">↑</div><div id="distanceBig" class="distance"></div><div id="instruction" class="instruction"></div><div id="nextText" class="next"></div></div>
<div class="progress"><span id="progressBar"></span></div>
<div class="meta"><span id="fromTo"></span><span id="remaining"></span></div>
<div class="row" style="margin-top:10px"><button id="demoBtn" onclick="advanceMeters(5)">5m進む（デモ）</button><button id="autoWalkBtn" onclick="simulateWalking()">▶ 自動歩行</button><button id="rerouteBtn" onclick="reroute()">🔄 再ルート</button><button id="stopBtn" onclick="stopNav()">案内終了</button></div>
</section>

<section class="card" id="correctionCard"><b id="correctionTitle">現在地の補正</b><div id="anchorRequired" class="anchorWarning hidden">先に、今いる改札・入口を選んでください。</div><div id="anchorsEl" class="chips" style="margin-top:9px"></div>
<div id="autoSensorNote" class="small" style="margin-top:8px">センサーは案内開始時に自動で起動します。</div>
<div class="status" style="margin-top:10px"><div><b id="placeNow">-</b><span id="currentLocLabel">現在地</span></div><div><b id="headingNow">0°</b><span id="headingLabel">向き</span></div><div><b id="accuracyNow">補正済</b><span id="accuracyLabel">位置精度</span></div></div>
<div class="row" style="margin-top:10px"><button id="compassBtn" onclick="enableCompass()">🧭 方位</button><button id="motionBtn" onclick="enableMotion()">👣 歩数</button><button id="gpsBtn" onclick="enableGPS()">📡 GPS精度</button></div></section>

<p id="footNote" class="small">駅と全国の代表的な大型商業施設では、選んだ入口から概算距離・向かうエリア・移動手順を表示します。数値は実測ではなく、左右の曲がり方や階・区画は公式マップで確認してください。</p>

<div class="legalLinks"><button onclick="openInfoPage('business')">施設の方へ</button><button onclick="openInfoPage('terms')">利用規約</button><button onclick="openInfoPage('privacy')">プライバシー</button><button onclick="openInfoPage('commerce')">特商法表記</button></div>


</main>
<a id="officialMapDock" class="officialDock hidden" href="#" target="_blank" rel="noopener">🗺 公式構内図</a>

<aside id="infoOverlay" class="infoOverlay hidden" aria-modal="true" role="dialog" aria-labelledby="infoTitle">
 <div class="infoTop"><button type="button" onclick="closeInfoPage()">← 戻る</button><b id="infoTitle">メニュー</b></div>
 <div id="infoBody" class="infoBody"></div>
</aside>

function reportButtons(p){return `<div class="reportRow"><button onclick='openCorrectionReport("場所が違う",${JSON.stringify(p.name)})'>場所が違う</button><button onclick='openCorrectionReport("距離が違う",${JSON.stringify(p.name)})'>距離が違う</button><button onclick='openCorrectionReport("設備がない",${JSON.stringify(p.name)})'>設備がない</button></div>`}

function buildGraph(){
 const g={}; Object.keys(AY_NODES).forEach(n=>g[n]=[]);
 AY_EDGES.forEach(([a,b,meters,cost,type])=>{g[a].push({to:b,meters,cost,type});g[b].push({to:a,meters,cost,type})});

const AY_G=buildGraph();
function shortest(start,target){
 const dist={},prev={},prevEdge={},q=new Set(Object.keys(AY_NODES));
 Object.keys(AY_NODES).forEach(n=>dist[n]=Infinity); dist[start]=0;
 while(q.size){let u=null,b=Infinity;q.forEach(n=>{if(dist[n]<b){b=dist[n];u=n}});if(u===null)break;q.delete(u);if(u===target)break;
   AY_G[u].forEach(e=>{if(!q.has(e.to))return;const nd=dist[u]+e.cost;if(nd<dist[e.to]){dist[e.to]=nd;prev[e.to]=u;prevEdge[e.to]=e}})

function turnFor(a,b,c){
 const A=AY_NODES[a],B=AY_NODES[b],C=AY_NODES[c];
 if(!A||!B||!C||A.floor!==B.floor||B.floor!==C.floor)return"";
 const v1=[B.x-A.x,B.y-A.y],v2=[C.x-B.x,C.y-B.y];
 const cross=v1[0]*v2[1]-v1[1]*v2[0],dot=v1[0]*v2[0]+v1[1]*v2[1];

}
function pathToSteps(path,prevEdge,targetName){

 for(let i=1;i<path.length;i++){
   const a=path[i-1],b=path[i],e=prevEdge[b],A=AY_NODES[a],B=AY_NODES[b];
   if(e.type==="vertical"){
     const dir=B.floor>A.floor?"↟":"↡";out.push({arrow:dir,meters:0,text:`エレベーターで ${B.floor}Fへ`,next:"降りたら案内を続けます"});
   } else {
     const t=i>=2?turnFor(path[i-2],a,b):"直進";
     const arrow=t==="右"?"→":t==="左"?"←":"↑";
     const text=t==="右"?`右へ曲がって ${e.meters}m進む`:t==="左"?`左へ曲がって ${e.meters}m進む`:`${e.meters}m進む`;
     out.push({arrow,meters:e.meters,text,next:i<path.length-1?"次の案内へ":`${targetName}はこの先です`});

function normText(s){return(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[？?！!。、\s_-]/g,'')}
function aliasQuery(s){const n=normText(s);for(const [canon,arr] of Object.entries(SEARCH_ALIAS)){if(arr.some(x=>n.includes(normText(x))))return canon}return s}
function localizedInstruction(s){if(s.arrow==='●')return T('arrived');if(s.arrow==='→')return T('right');if(s.arrow==='←')return T('left');if(s.arrow==='↟')return T('up');if(s.arrow==='↡')return T('down');return T('straight')}










// ===== Background route learning (no visible learning UI) =====
// Set this later to the private aggregation API endpoint to combine many users.
// Example: "https://YOUR-WORKER.example/route-sample"
const AUTO_LEARN_API = "";
const AUTO_AVG_API = "";
const BG_DB_KEY = "indoorNavBackgroundLearningV3";

let bgTrip = null;
let bgTimer = null;
let bgLastHeading = null;
let bgLastTurnAt = 0;
let bgLastStepPeak = 0;
let bgSensorsReady = false;
let bgPermissionAttempted = false;

function bgDB(){
  try{return JSON.parse(localStorage.getItem(BG_DB_KEY)||"{}")}catch(e){return{}}
}
function saveBgDB(db){localStorage.setItem(BG_DB_KEY,JSON.stringify(db))}
function bgRouteKeyFor(facility,from,destination){
  return `${facility}::${from||"不明"}::${destination}`;
}
function bgRouteKey(){
  return bgRouteKeyFor(currentFacility().name,currentAnchor,selected?.name||"未選択");
}
function bgRobustAverage(samples){
  if(!samples?.length)return 0;
  const vals=samples.map(x=>+x.meters||0).filter(x=>x>0).sort((a,b)=>a-b);
  if(!vals.length)return 0;
  let use=vals;
  if(vals.length>=5){
    const cut=Math.max(1,Math.floor(vals.length*.1));
    if(vals.length-cut*2>=2) use=vals.slice(cut,vals.length-cut);
  }
  return use.reduce((a,b)=>a+b,0)/use.length;
}
function learnedMetersForPlace(p){
  if(!p)return 0;
  const arr=bgDB()[bgRouteKeyFor(currentFacility().name,currentAnchor,p.name)]||[];
  const avg=bgRobustAverage(arr);
  return avg>0?avg:0;
}

// Override the current estimate: learned average wins after enough local samples.
const _baseCurrentEstimateMeters =
  (typeof currentEstimateMeters==="function") ? currentEstimateMeters : null;

currentEstimateMeters = function(p){
  const learned = learnedMetersForPlace(p);
  const arr = p ? (bgDB()[bgRouteKeyFor(currentFacility().name,currentAnchor,p.name)]||[]) : [];
  if(learned>0 && arr.length>=3) return Math.round(learned);
  if(_baseCurrentEstimateMeters) return _baseCurrentEstimateMeters(p);
  return +p?.estimateMeters||0;
};

async function ensureBgSensors(){
  if(bgSensorsReady)return true;
  if(bgPermissionAttempted && !bgSensorsReady)return false;
  bgPermissionAttempted=true;
  try{
    if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
      const p=await DeviceMotionEvent.requestPermission();
      if(p!=="granted")throw new Error("motion denied");
    }
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=="granted")throw new Error("orientation denied");
    }

    window.addEventListener("devicemotion",e=>{
      if(!bgTrip)return;
      const a=e.accelerationIncludingGravity;if(!a)return;
      const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
      const now=Date.now();
      if(mag>12.2&&now-bgLastStepPeak>450){
        bgLastStepPeak=now;
        bgTrip.steps++;
        // PWA prototype stride estimate. Native app can replace this with CMPedometer distance.
        bgTrip.meters=+(bgTrip.steps*0.72).toFixed(1);
        bgTrip.lastMoveAt=now;
      }
    },true);

    window.addEventListener("deviceorientation",e=>{
      if(!bgTrip||e.alpha==null)return;
      const h=(360-e.alpha)%360;
      if(bgLastHeading==null){bgLastHeading=h;return}
      const signed=(((h-bgLastHeading)+540)%360)-180;
      const now=Date.now();
      if(Math.abs(signed)>=35 &&
         now-bgLastTurnAt>2200 &&
         bgTrip.steps-bgTrip.lastTurnStep>=2){
        bgTrip.turns.push({dir:signed>0?"right":"left",step:bgTrip.steps});
        bgTrip.lastTurnStep=bgTrip.steps;
        bgLastTurnAt=now;
        bgLastHeading=h;
      }else if(Math.abs(signed)<15){
        bgLastHeading=(bgLastHeading*.85+h*.15)%360;
      }
    },true);

    bgSensorsReady=true;
    return true;
  }catch(e){
    // No separate learning UI. The navigation can still work with map estimates.
    return false;
  }
}

async function beginBgTrip(){
  if(!selected)return;
  await ensureBgSensors();

  bgTrip={
    startedAt:Date.now(),
    facility:currentFacility().name,
    from:currentAnchor||"不明",
    destination:selected.name,
    steps:0,
    meters:0,
    turns:[],
    lastTurnStep:0,
    lastMoveAt:Date.now()
  };
  bgLastHeading=null;
  bgLastTurnAt=0;

  if(bgTimer)clearInterval(bgTimer);
  bgTimer=setInterval(()=>{
    // The route engine reaching the last step is the current PWA arrival signal.
    if(bgTrip && selected && navSteps?.length && stepIndex>=navSteps.length-1){
      finishBgTrip("route-arrival");
    }
  },1000);
}

async function fetchCloudAverage(facility,from,destination){
  if(!AUTO_AVG_API)return 0;
  try{
    const u=new URL(AUTO_AVG_API);
    u.searchParams.set("facility",facility);
    u.searchParams.set("from",from);
    u.searchParams.set("destination",destination);
    const r=await fetch(u.toString(),{cache:"no-store"});
    if(!r.ok)return 0;
    const j=await r.json();
    return +j.averageMeters||0;
  }catch(e){return 0}
}

async function finishBgTrip(reason){
  if(!bgTrip)return;

  const sample={
    at:new Date().toISOString(),
    facility:bgTrip.facility,
    from:bgTrip.from,
    destination:bgTrip.destination,
    steps:bgTrip.steps,
    meters:bgTrip.meters,
    durationSec:Math.max(1,Math.round((Date.now()-bgTrip.startedAt)/1000)),
    turns:bgTrip.turns.length,
    completion:reason
  };

  // Reject obviously accidental samples.
  if(sample.steps>=4 && sample.meters>=2){
    const db=bgDB();
    const k=bgRouteKeyFor(sample.facility,sample.from,sample.destination);
    db[k]=db[k]||[];
    db[k].push(sample);
    if(db[k].length>200)db[k]=db[k].slice(-200);
    saveBgDB(db);

    // If the private multi-user API is connected later, upload silently.
    if(AUTO_LEARN_API){
      try{
        await fetch(AUTO_LEARN_API,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(sample),
          keepalive:true
        });
      }catch(e){}
    }
  }

  bgTrip=null;
  if(bgTimer){clearInterval(bgTimer);bgTimer=null}
}

function cancelBgTrip(){
  bgTrip=null;
  if(bgTimer){clearInterval(bgTimer);bgTimer=null}
}

// Start silently when a destination is selected.
const _bgOrigStartNavByName=startNavByName;
startNavByName=function(name){
  _bgOrigStartNavByName(name);
  // Because this comes directly from the user's tap, iOS can show its one-time
  // motion/orientation permission prompt here when required.
  setTimeout(()=>{if(selected)beginBgTrip()},0);
};

// Save automatically on arrival; discard if navigation is ended early.
const _bgOrigStopNav=stopNav;
stopNav=function(){
  const arrived=selected&&navSteps?.length&&stepIndex>=navSteps.length-1;
  if(arrived)finishBgTrip("route-arrival");
  else cancelBgTrip();
  _bgOrigStopNav();
};



// ===== Fully automatic sensors =====
let autoSensorStarted=false;
let autoGeoWatchId=null;

async function startAllSensorsAutomatically(){
  if(autoSensorStarted)return;
  autoSensorStarted=true;

  let motionOK=false, orientationOK=false, geoOK=false;

  // iOS requires these permission requests to happen from a user action.
  // startNavByName() is called from the destination tap, so we request them there.
  try{
    if(typeof DeviceMotionEvent!=="undefined" &&
       typeof DeviceMotionEvent.requestPermission==="function"){
      const p=await DeviceMotionEvent.requestPermission();
      motionOK=(p==="granted");
    }else{
      motionOK=true;
    }
  }catch(e){}

  try{
    if(typeof DeviceOrientationEvent!=="undefined" &&
       typeof DeviceOrientationEvent.requestPermission==="function"){
      const p=await DeviceOrientationEvent.requestPermission();
      orientationOK=(p==="granted");
    }else{
      orientationOK=true;
    }
  }catch(e){}

  if(orientationOK){
    window.addEventListener("deviceorientation",e=>{
      if(e.alpha!=null){
        const h=(360-e.alpha)%360;
        if(typeof heading!=="undefined") heading=h;
        const el=document.getElementById("headingNow");
        if(el) el.textContent=Math.round(h)+"°";
      }
    },true);
  }

  if(motionOK){
    let localLastPeak=0;
    window.addEventListener("devicemotion",e=>{
      const a=e.accelerationIncludingGravity;
      if(!a)return;
      const mag=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);
      const now=Date.now();
      if(mag>12.2 && now-localLastPeak>450){
        localLastPeak=now;
        // If navigation is active, advance slightly using the same walking estimate.
        if(typeof selected!=="undefined" && selected && typeof advanceMeters==="function"){
          advanceMeters(.72);
        }
      }
    },true);
  }

  try{
    if("geolocation" in navigator){
      autoGeoWatchId=navigator.geolocation.watchPosition(
        p=>{
          geoOK=true;
          const el=document.getElementById("accuracyNow");
          if(el) el.textContent="±"+Math.round(p.coords.accuracy)+"m";
        },
        ()=>{
          const el=document.getElementById("accuracyNow");
          if(el && el.textContent==="補正済") el.textContent="位置推定";
        },
        {enableHighAccuracy:true,maximumAge:1500,timeout:10000}
      );
    }
  }catch(e){}

  const note=document.getElementById("autoSensorNote");
  if(note){
    const labels=[];
    labels.push(orientationOK?"方位ON":"方位未許可");
    labels.push(motionOK?"歩行ON":"歩行未許可");
    labels.push("位置自動");
    note.textContent="自動センサー：" + labels.join(" / ");
  }
}

// Start all sensors automatically when the user chooses a destination.
// This is the earliest point on iPhone where the permission dialog can be requested
// without adding separate 方位/歩数/GPS buttons.
const _sensorOrigStartNavByName = startNavByName;
startNavByName = function(name){
  _sensorOrigStartNavByName(name);
   if(selected)startAllSensorsAutomatically();
};
