<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>館内ナビ｜イオンモール綾川</title>
<style>
*{box-sizing:border-box}:root{--blue:#1378ff;--ink:#17202a;--muted:#68727c;--bg:#f5f7f9;--line:#dce2e7}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--ink)}
header{background:white;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);padding:13px}
h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}main{max-width:760px;margin:auto;padding:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.search{display:flex;gap:7px;margin-top:10px}.search input{flex:1;min-width:0;border:1px solid #cbd2d8;border-radius:12px;padding:13px;font-size:15px}.search button{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:0 16px}
.floorrow{display:flex;gap:6px;margin-top:9px}.floorrow button{flex:1;padding:9px;border:1px solid #ccd3d9;border-radius:10px;background:#fff;font-weight:800}.floorrow .on{background:#17202a;color:white}
.bigstep{background:linear-gradient(180deg,#1477ff,#0d66dc);color:#fff;border-radius:18px;padding:18px;text-align:center}
.arrow{font-size:68px;line-height:1;margin:6px 0}.distance{font-size:33px;font-weight:900}.instruction{font-size:22px;font-weight:900;margin-top:5px}
.next{margin-top:10px;padding-top:10px;border-top:1px solid #ffffff40;font-size:13px}.progress{height:9px;border-radius:999px;background:#e7ebef;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--blue);width:0%}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{border:1px solid #ccd3d9;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}
.result{padding:11px;border:1px solid #e1e6ea;border-radius:11px;margin-top:7px}.result b{font-size:14px}.result span{font-size:11px;color:var(--muted);margin-left:6px}
.row{display:flex;gap:7px;flex-wrap:wrap}.row button,.row a{flex:1;min-width:130px;text-decoration:none;text-align:center;border:1px solid #cbd2d8;background:#fff;color:var(--ink);border-radius:11px;padding:11px;font-weight:800}
.primary{background:var(--blue)!important;color:#fff!important;border:0!important}.danger{background:#fff1ef!important;color:#a44235!important}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status div{background:#f7f9fb;border-radius:12px;padding:10px;text-align:center}.status b{display:block;font-size:18px}.status span{font-size:10px;color:var(--muted)}
.small{font-size:11px;color:var(--muted);line-height:1.5}.hidden{display:none}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="館内ナビ">

</head>
<body>
<header><h1>🧭 館内ナビ｜イオンモール綾川</h1><div class="sub">地図を見続けなくても「何m直進・右・左」で案内</div></header>
<main>
<section class="card">
<div class="search"><input id="q" placeholder="無印に行きたい / 映画館 / トイレ"><button onclick="searchPlace()">検索</button></div>
<div class="floorrow"><button class="on" onclick="setFloor(1,this)">1F</button><button onclick="setFloor(2,this)">2F</button><button onclick="setFloor(3,this)">3F</button></div>
<div id="results"></div>
</section>

<section class="card">
<div class="row">
<a href="https://www.aeon.jp/sc/ayagawa/shop/floor/ebook/ayagawa/pageindices/" target="_blank">🗺 公式マップを見る</a>
<button onclick="setAnchor('中央入口')">📍 中央入口にいる</button>
</div>
</section>

<section id="navCard" class="card hidden">
<div class="bigstep">
<div id="stepNo" style="font-size:12px;opacity:.85">案内 1 / 4</div>
<div id="arrow" class="arrow">↑</div>
<div id="distanceBig" class="distance">30m</div>
<div id="instruction" class="instruction">まっすぐ進む</div>
<div id="nextText" class="next">次：右へ曲がる</div>
</div>
<div class="progress"><span id="progressBar"></span></div>
<div class="meta"><span id="fromTo">現在地 → 目的地</span><span id="remaining">残り 約85m</span></div>
<div class="row" style="margin-top:10px">
<button class="primary" onclick="advance()">1歩進む（デモ）</button>
<button onclick="reroute()">現在地から再計算</button>
<button onclick="simulateWalking()">▶ 自動歩行デモ</button><button onclick="markOffRoute()">↩ ルートを外れる</button><button class="danger" onclick="stopNav()">案内終了</button>
</div>
</section>

<section class="card">
<b>現在地の補正</b>
<div class="pills" style="margin-top:9px">
<button class="pill" onclick="setAnchor('中央入口')">中央入口</button>
<button class="pill" onclick="setAnchor('中央コート')">中央コート</button>
<button class="pill" onclick="setAnchor('西EV')">西EV</button>
<button class="pill" onclick="setAnchor('東EV')">東EV</button>
</div>
<div class="status" style="margin-top:10px">
<div><b id="placeNow">中央入口</b><span>現在地</span></div>
<div><b id="headingNow">0°</b><span>向き</span></div>
<div><b id="accuracyNow">補正済</b><span>位置精度</span></div>
</div>
<div class="row" style="margin-top:10px">
<button onclick="enableCompass()">🧭 方位センサー</button>
<button onclick="enableMotion()">👣 歩数センサー</button>
<button onclick="enableGPS()">📡 GPS精度を見る</button>
</div>
</section>

<p class="small">このv2では、歩くにつれて「30m → 20m → 5m」と残り距離が減り、曲がり角の手前で「あと5mで右です」と表示します。ルートから外れた時の再計算デモも入れています。GPSだけでは屋内の正確な位置が取りにくいため、実用版では入口/QRチェックポイント、歩数・方位、BLEビーコン・UWB・Wi‑Fi RTTなどを組み合わせる想定です。</p>
</main>

<script>
const DATA={
1:[
{name:"無印良品",floor:1,steps:[
 {arrow:"↑",meters:30,text:"まっすぐ進む",next:"次：右へ曲がる"},
 {arrow:"→",meters:15,text:"右へ進む",next:"次：そのまま直進"},
 {arrow:"↑",meters:20,text:"まっすぐ進む",next:"次：左側に目的地"},
 {arrow:"●",meters:0,text:"到着",next:"無印良品です"}]},
{name:"カルディ",floor:1,steps:[
 {arrow:"↑",meters:35,text:"まっすぐ進む",next:"次：左へ曲がる"},
 {arrow:"←",meters:20,text:"左へ進む",next:"次：目的地"},
 {arrow:"●",meters:0,text:"到着",next:"カルディです"}]},
{name:"トイレ",floor:1,steps:[
 {arrow:"↑",meters:20,text:"まっすぐ進む",next:"次：左へ"},
 {arrow:"←",meters:10,text:"左へ進む",next:"次：トイレ"},
 {arrow:"●",meters:0,text:"到着",next:"トイレです"}]}
],
2:[
{name:"ABCマート スポーツ",floor:2,steps:[
 {arrow:"↑",meters:15,text:"EV/ESまで進む",next:"次：2Fへ"},
 {arrow:"↟",meters:0,text:"2Fへ上がる",next:"次：右へ"},
 {arrow:"→",meters:25,text:"右へ進む",next:"次：目的地"},
 {arrow:"●",meters:0,text:"到着",next:"ABCマート スポーツです"}]}
],
3:[
{name:"イオンシネマ綾川",floor:3,steps:[
 {arrow:"↑",meters:15,text:"EV/ESまで進む",next:"次：3Fへ"},
 {arrow:"↟",meters:0,text:"3Fへ上がる",next:"次：まっすぐ"},
 {arrow:"↑",meters:45,text:"まっすぐ進む",next:"次：右側"},
 {arrow:"●",meters:0,text:"到着",next:"イオンシネマ綾川です"}]},
{name:"フードコート",floor:3,steps:[
 {arrow:"↑",meters:15,text:"EV/ESまで進む",next:"次：3Fへ"},
 {arrow:"↟",meters:0,text:"3Fへ上がる",next:"次：左へ"},
 {arrow:"←",meters:30,text:"左へ進む",next:"次：フードコート"},
 {arrow:"●",meters:0,text:"到着",next:"フードコートです"}]}
]
};

let floor=1,currentAnchor="中央入口",selected=null,stepIndex=0,heading=0;
let stepRemaining=0,totalRemaining=0,lastMotion=0,walking=false,offRouteCount=0;
let autoTimer=null;

function setFloor(f,b){
 floor=f;
 document.querySelectorAll(".floorrow button").forEach(x=>x.classList.remove("on"));
 (b||document.querySelectorAll(".floorrow button")[f-1]).classList.add("on");
}
function normalize(q){
 q=q.replace(/[？?！!。、\s]/g,"");
 if(q.includes("無印"))return"無印良品";
 if(q.includes("映画")||q.includes("シネマ"))return"イオンシネマ綾川";
 if(q.includes("トイレ")||q.includes("お手洗い"))return"トイレ";
 if(q.includes("フード")||q.includes("ご飯")||q.includes("食事"))return"フードコート";
 return q;
}
function searchPlace(){
 const q=normalize(document.getElementById("q").value.trim());
 if(!q)return;
 let found=[];
 Object.values(DATA).flat().forEach(x=>{if(x.name.includes(q)||q.includes(x.name))found.push(x)});
 results.innerHTML=found.length
   ? found.map(x=>`<div class="result" onclick='startNav(${JSON.stringify(x)})'><b>${x.name}</b><span>${x.floor}F</span></div>`).join("")
   : `<div class="result">見つかりませんでした。</div>`;
}
function startNav(x){
 selected=JSON.parse(JSON.stringify(x));
 stepIndex=0;
 setFloor(x.floor);
 navCard.classList.remove("hidden");
 resetStepDistances();
 renderStep();
}
function resetStepDistances(){
 if(!selected)return;
 stepRemaining=selected.steps[stepIndex]?.meters||0;
 totalRemaining=selected.steps.slice(stepIndex).reduce((a,b)=>a+b.meters,0);
}
function renderStep(){
 if(!selected)return;
 const s=selected.steps[stepIndex];
 arrow.textContent=s.arrow;
 distanceBig.textContent=s.meters>0?Math.max(0,Math.round(stepRemaining))+"m":"";
 instruction.textContent=s.text;
 nextText.textContent=warningText(s);
 stepNo.textContent="案内 "+(stepIndex+1)+" / "+selected.steps.length;
 fromTo.textContent=currentAnchor+" → "+selected.name;
 totalRemaining=selected.steps.slice(stepIndex).reduce((a,b,i)=>a+(i===0?stepRemaining:b.meters),0);
 remaining.textContent=totalRemaining>0?"残り 約"+Math.max(0,Math.round(totalRemaining))+"m":"到着";
 progressBar.style.width=((stepIndex+1)/selected.steps.length*100)+"%";
}
function warningText(s){
 if(s.meters<=0)return s.next;
 if(stepRemaining<=5 && s.next.includes("右")) return "⚠️ あと5mで右です";
 if(stepRemaining<=5 && s.next.includes("左")) return "⚠️ あと5mで左です";
 if(stepRemaining<=3 && s.next.includes("2F")) return "⚠️ まもなく2Fへ上がります";
 if(stepRemaining<=3 && s.next.includes("3F")) return "⚠️ まもなく3Fへ上がります";
 return s.next;
}
function advanceMeters(m=5){
 if(!selected)return;
 const s=selected.steps[stepIndex];
 if(s.meters===0){
   advanceStep();
   return;
 }
 stepRemaining=Math.max(0,stepRemaining-m);
 if(stepRemaining===0) advanceStep();
 else renderStep();
}
function advanceStep(){
 if(!selected)return;
 if(stepIndex<selected.steps.length-1){
   stepIndex++;
   stepRemaining=selected.steps[stepIndex].meters;
   renderStep();
 } else {
   renderStep();
 }
}
function advance(){advanceMeters(5)}
function reroute(){
 if(!selected)return;
 offRouteCount=0;
 stepIndex=0;
 resetStepDistances();
 instruction.textContent="現在地から再計算しました";
 setTimeout(renderStep,500);
}
function stopNav(){
 selected=null;
 if(autoTimer){clearInterval(autoTimer);autoTimer=null}
 navCard.classList.add("hidden");
}
function setAnchor(name){
 currentAnchor=name;
 placeNow.textContent=name;
 accuracyNow.textContent="補正済";
 if(selected)reroute();
}

function simulateWalking(){
 if(autoTimer){clearInterval(autoTimer);autoTimer=null;walking=false;accuracyNow.textContent="停止";return}
 walking=true;
 accuracyNow.textContent="歩行デモ中";
 autoTimer=setInterval(()=>{
   if(!selected){clearInterval(autoTimer);autoTimer=null;return}
   advanceMeters(2);
 },900);
}

function markOffRoute(){
 if(!selected)return;
 offRouteCount++;
 instruction.textContent="ルートから外れました";
 nextText.textContent="🔄 新しいルートを計算中…";
 setTimeout(reroute,700);
}

async function enableCompass(){
 try{
  if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
    const p=await DeviceOrientationEvent.requestPermission();
    if(p!=="granted")throw 0;
  }
  window.addEventListener("deviceorientation",e=>{
    if(e.alpha!=null){
      heading=(360-e.alpha)%360;
      headingNow.textContent=Math.round(heading)+"°";
    }
  },true);
  accuracyNow.textContent="方位ON";
 }catch(e){accuracyNow.textContent="方位未許可"}
}
async function enableMotion(){
 try{
  if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
    const p=await DeviceMotionEvent.requestPermission();
    if(p!=="granted")throw 0;
  }
  window.addEventListener("devicemotion",e=>{
    const a=e.accelerationIncludingGravity;
    if(!a)return;
    const m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2),now=Date.now();
    if(m>12.2&&now-lastMotion>450){
      lastMotion=now;
      if(selected)advanceMeters(0.75);
    }
  },true);
  accuracyNow.textContent="歩数ON";
 }catch(e){accuracyNow.textContent="歩数未許可"}
}
function enableGPS(){
 if(!navigator.geolocation){accuracyNow.textContent="GPS非対応";return}
 navigator.geolocation.getCurrentPosition(p=>{
   accuracyNow.textContent="±"+Math.round(p.coords.accuracy)+"m";
 },()=>{accuracyNow.textContent="GPS未許可"},{enableHighAccuracy:true,timeout:8000});
}
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>

</body>
</html>
