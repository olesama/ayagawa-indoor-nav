<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f9;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17202a}
header{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #dce2e7;padding:13px}
h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:#68727c}
main{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #dce2e7;border-radius:18px;padding:14px;margin-bottom:10px}
select,input{font-size:16px}.facility{width:100%;padding:13px;border:1px solid #cbd2d8;border-radius:12px;background:#fff;font-weight:800}
.search{display:flex;gap:7px;margin-top:10px}.search input{flex:1;min-width:0;padding:13px;border:1px solid #cbd2d8;border-radius:12px}.search button{border:0;border-radius:12px;background:#1378ff;color:#fff;font-weight:800;padding:0 16px}
.row{display:flex;gap:7px;flex-wrap:wrap}.row button,.row a{flex:1;min-width:130px;text-decoration:none;text-align:center;border:1px solid #cbd2d8;background:#fff;color:#17202a;border-radius:11px;padding:11px;font-weight:800}

.result{padding:11px;border:1px solid #e1e6ea;border-radius:11px;margin-top:7px}.result span{font-size:11px;color:#68727c;margin-left:6px}

.progress{height:9px;border-radius:999px;background:#e7ebef;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:#1378ff}.meta{display:flex;justify-content:space-between;font-size:12px;color:#68727c;margin-top:7px}

<body>
<header><h1>🧭 館内ナビ</h1><div class="sub">20施設対応・公式マップ＋方向案内</div></header>
<main>
<section class="card">
<select id="facilitySelect" class="facility" onchange="changeFacility(this.value)"></select>
<div id="facilityInfo" style="margin-top:11px"></div>
<div class="row" style="margin-top:10px"><a id="officialMap" href="#" target="_blank">🗺 公式マップ/案内</a><button onclick="setAnchor(F[key].anchors[0])">📍 ここを現在地にする</button></div>
</section>

<section class="card">
<div class="search"><input id="q" placeholder="行きたい場所を入力"><button onclick="searchPlace()">検索</button></div>
<div id="quick" class="chips" style="margin-top:9px"></div><div id="results"></div>
</section>

<section id="navCard" class="card hidden">
<div class="bigstep"><div id="stepNo" style="font-size:12px;opacity:.85"></div><div id="arrow" class="arrow">↑</div><div id="distanceBig" class="distance">30m</div><div id="instruction" class="instruction">まっすぐ進む</div><div id="nextText" class="next"></div></div>
<div class="progress"><span id="progressBar"></span></div><div class="meta"><span id="fromTo"></span><span id="remaining"></span></div>
<div class="row" style="margin-top:10px"><button onclick="advanceMeters(5)">5m進む（デモ）</button><button onclick="simulateWalking()">▶ 自動歩行</button><button onclick="reroute()">🔄 再ルート</button><button onclick="stopNav()">案内終了</button></div>
</section>

<section class="card">
<b>現在地の補正</b><div id="anchors" class="chips" style="margin-top:9px"></div>
<div class="status" style="margin-top:10px"><div><b id="placeNow">-</b><span>現在地</span></div><div><b id="headingNow">0°</b><span>向き</span></div><div><b id="accuracyNow">補正済</b><span>位置精度</span></div></div>
<div class="row" style="margin-top:10px"><button onclick="enableCompass()">🧭 方位</button><button onclick="enableMotion()">👣 歩数</button><button onclick="enableGPS()">📡 GPS精度</button></div>
</section>

<p class="small">20施設対応版。公式マップ/案内ボタンは各施設の公式サイトへ移動します。館内ナビの距離・曲がり方はまだ動作確認用の試作値です。本番利用には公式構内図・現地測定・屋内測位の実装が必要です。</p>
</main>

 key=k; const x=F[k];
 facilityInfo.innerHTML=`<div class="facilityTitle">${x.name}</div><div class="facilitySub">${x.area}</div><span class="badge">公式案内リンク対応</span>`;
 officialMap.href=x.map;
 quick.innerHTML=x.places.map(p=>`<button class="chip" onclick='quickSearch(${JSON.stringify(p.name)})'>${p.name}</button>`).join("");
 anchors.innerHTML=x.anchors.map(v=>`<button class="chip" onclick='setAnchor(${JSON.stringify(v)})'>${v}</button>`).join("");
 results.innerHTML=""; stopNav(); currentAnchor=x.anchors[0]; placeNow.textContent=currentAnchor;
}
function quickSearch(v){q.value=v;searchPlace()}
function searchPlace(){
 const s=q.value.trim().replace(/[？?！!。、\s]/g,""); if(!s)return;
 const found=F[key].places.filter(p=>p.name.replace(/\s/g,"").includes(s)||s.includes(p.name.replace(/\s/g,"")));
 results.innerHTML=found.length?found.map(p=>`<div class="result" onclick='startNav(${JSON.stringify(p)})'><b>${p.name}</b><span>${p.level}</span></div>`).join(""):`<div class="result">見つかりませんでした。</div>`;
}
function startNav(p){selected=JSON.parse(JSON.stringify(p));stepIndex=0;stepRemaining=selected.steps[0].meters;navCard.classList.remove("hidden");renderStep()}
function renderStep(){
 if(!selected)return; const s=selected.steps[stepIndex];
 arrow.textContent=s.arrow; distanceBig.textContent=s.meters>0?Math.round(stepRemaining)+"m":"";
 instruction.textContent=s.text;
 nextText.textContent=(s.meters>0&&stepRemaining<=5&&s.next.includes("右"))?"⚠️ あと5mで右です":(s.meters>0&&stepRemaining<=5&&s.next.includes("左"))?"⚠️ あと5mで左です":s.next;
 stepNo.textContent=`案内 ${stepIndex+1} / ${selected.steps.length}`;
 fromTo.textContent=`${currentAnchor} → ${selected.name}`;
 const rem=selected.steps.slice(stepIndex).reduce((a,b,i)=>a+(i===0?stepRemaining:b.meters),0);
 remaining.textContent=rem>0?`残り 約${Math.round(rem)}m`:"到着";
 progressBar.style.width=((stepIndex+1)/selected.steps.length*100)+"%";
}
function advanceMeters(m){if(!selected)return;const s=selected.steps[stepIndex];if(s.meters===0){advanceStep();return}stepRemaining=Math.max(0,stepRemaining-m);if(stepRemaining===0)advanceStep();else renderStep()}
function advanceStep(){if(stepIndex<selected.steps.length-1){stepIndex++;stepRemaining=selected.steps[stepIndex].meters;renderStep()}}
function simulateWalking(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;accuracyNow.textContent="停止";return}accuracyNow.textContent="歩行デモ中";autoTimer=setInterval(()=>{if(selected)advanceMeters(2)},900)}
function reroute(){if(!selected)return;stepIndex=0;stepRemaining=selected.steps[0].meters;renderStep()}
function stopNav(){selected=null;if(autoTimer){clearInterval(autoTimer);autoTimer=null}navCard.classList.add("hidden")}
function setAnchor(v){currentAnchor=v;placeNow.textContent=v;accuracyNow.textContent="補正済";if(selected)reroute()}
async function enableCompass(){try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){const p=await DeviceOrientationEvent.requestPermission();if(p!=="granted")throw 0}window.addEventListener("deviceorientation",e=>{if(e.alpha!=null){heading=(360-e.alpha)%360;headingNow.textContent=Math.round(heading)+"°"}},true);accuracyNow.textContent="方位ON"}catch(e){accuracyNow.textContent="方位未許可"}}
async function enableMotion(){try{if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){const p=await DeviceMotionEvent.requestPermission();if(p!=="granted")throw 0}window.addEventListener("devicemotion",e=>{const a=e.accelerationIncludingGravity;if(!a)return;const m=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2),now=Date.now();if(m>12.2&&now-lastMotion>450){lastMotion=now;if(selected)advanceMeters(.75)}},true);accuracyNow.textContent="歩数ON"}catch(e){accuracyNow.textContent="歩数未許可"}}
function enableGPS(){if(!navigator.geolocation){accuracyNow.textContent="GPS非対応";return}navigator.geolocation.getCurrentPosition(p=>accuracyNow.textContent="±"+Math.round(p.coords.accuracy)+"m",()=>accuracyNow.textContent="GPS未許可",{enableHighAccuracy:true,timeout:8000})}
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
init();
</script>
</body></html>
