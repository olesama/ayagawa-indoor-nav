<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="館内ナビ">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>館内ナビ</title>
<style>
*{box-sizing:border-box}:root{--blue:#1378ff;--ink:#17202a;--muted:#68727c;--bg:#f5f7f9;--line:#dce2e7;--orange:#ff8a00;--green:#148a54}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:var(--ink)}
header{background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);padding:13px}h1{font-size:18px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}
main{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
select,input{font-size:16px}.facility{width:100%;padding:13px;border:1px solid #cbd2d8;border-radius:12px;background:#fff;font-weight:800}
.search{display:flex;gap:7px;margin-top:10px}.search input{flex:1;min-width:0;padding:13px;border:1px solid #cbd2d8;border-radius:12px}.search button{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;padding:0 16px}
.row{display:flex;gap:7px;flex-wrap:wrap}.row button,.row a{flex:1;min-width:128px;text-decoration:none;text-align:center;border:1px solid #cbd2d8;background:#fff;color:var(--ink);border-radius:11px;padding:11px;font-weight:800}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #ccd3d9;background:#fff;border-radius:999px;padding:8px 11px;font-size:12px}
.result{padding:11px;border:1px solid #e1e6ea;border-radius:11px;margin-top:7px}.result span{font-size:11px;color:var(--muted);margin-left:6px}
.bigstep{background:linear-gradient(180deg,#1477ff,#0d66dc);color:#fff;border-radius:18px;padding:18px;text-align:center}.arrow{font-size:68px;line-height:1;margin:6px}.distance{font-size:33px;font-weight:900}.instruction{font-size:22px;font-weight:900}.next{margin-top:10px;padding-top:10px;border-top:1px solid #ffffff40;font-size:13px}
.progress{height:9px;border-radius:999px;background:#e7ebef;overflow:hidden;margin-top:9px}.progress span{display:block;height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;gap:8px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.status div{background:#f7f9fb;border-radius:12px;padding:10px;text-align:center}.status b{display:block;font-size:14px}.status span{font-size:10px;color:var(--muted)}
.facilityTitle{font-size:20px;font-weight:900}.facilitySub,.small{font-size:11px;color:var(--muted);line-height:1.55}.hidden{display:none}
.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;margin-top:6px;background:#eaf8f1;color:var(--green)}.badge.proto{background:#fff5e6;color:#a45b00}
.precision{background:#f3fbf7;border:1px solid #cdebdc;border-radius:12px;padding:10px;margin-top:10px;font-size:12px;line-height:1.5}
</style></head>
<body>
<header><h1>🧭 館内ナビ</h1><div class="sub">綾川イオンは通路グラフから経路・距離を自動計算</div></header>
<main>
<section class="card">
<select id="facilitySelect" class="facility" onchange="changeFacility(this.value)"></select>
<div id="facilityInfo" style="margin-top:11px"></div>
<div class="row" style="margin-top:10px"><a id="officialMap" href="#" target="_blank">🗺 公式マップ/案内</a><button onclick="setAnchor(currentFacility().anchors[0])">📍 現在地を補正</button></div>
<div id="precisionNote" class="precision hidden"></div>
</section>

<section class="card">
<div class="search"><input id="q" placeholder="行きたい場所を入力"><button onclick="searchPlace()">検索</button></div>
<div id="quick" class="chips" style="margin-top:9px"></div><div id="results"></div>
</section>

<section id="navCard" class="card hidden">
<div class="bigstep"><div id="stepNo" style="font-size:12px;opacity:.85"></div><div id="arrow" class="arrow">↑</div><div id="distanceBig" class="distance"></div><div id="instruction" class="instruction"></div><div id="nextText" class="next"></div></div>
<div class="progress"><span id="progressBar"></span></div>
<div class="meta"><span id="fromTo"></span><span id="remaining"></span></div>
<div class="row" style="margin-top:10px"><button onclick="advanceMeters(5)">5m進む（デモ）</button><button onclick="simulateWalking()">▶ 自動歩行</button><button onclick="reroute()">🔄 再ルート</button><button onclick="stopNav()">案内終了</button></div>
</section>

<section class="card"><b>現在地の補正</b><div id="anchorsEl" class="chips" style="margin-top:9px"></div>
<div class="status" style="margin-top:10px"><div><b id="placeNow">-</b><span>現在地</span></div><div><b id="headingNow">0°</b><span>向き</span></div><div><b id="accuracyNow">補正済</b><span>位置精度</span></div></div>
<div class="row" style="margin-top:10px"><button onclick="enableCompass()">🧭 方位</button><button onclick="enableMotion()">👣 歩数</button><button onclick="enableGPS()">📡 GPS精度</button></div></section>

<p class="small">綾川イオンでは、固定の案内文ではなく通路ネットワークから最短経路と歩行距離を計算します。距離は公式フロア情報を基準にした図面スケール推定で、センチ単位の実測値ではありません。最終的な実用版では現地実測で各通路長を校正します。</p>
</main>

function startNavByName(name){

function buildGraph(){

function shortest(start,target){

}
function turnFor(a,b,c){
 const A=AY_NODES[a],B=AY_NODES[b],C=AY_NODES[c];

}
function pathToSteps(path,prevEdge,targetName){

 for(let i=1;i<path.length;i++){
